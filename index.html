<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fortuna Park — жилой комплекс</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;700&display=swap">
<style>
:root{--bg:#eef3f8;--surface:#ffffff;--ink:#14202c;--mute:#566574;--line:rgba(20,32,44,.12);--accent:#1f6aa5;--on-accent:#fff;--b1:#7db7ec;--b2:#a9e0d0;--b3:#f4cf9a;--day:1;--night:0;--glass-bd:rgba(255,255,255,.7);--glass-hi:rgba(255,255,255,.9);--sh:rgba(20,50,90,.16);box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1118;--surface:#1a2430;--ink:#eef1f3;--mute:#9fabb7;--line:rgba(255,255,255,.12);--accent:#f0993f;--on-accent:#2a1700;--b1:#e58a2f;--b2:#3b5f8f;--b3:#6a3c86;--day:0;--night:1;--glass-bd:rgba(255,255,255,.18);--glass-hi:rgba(255,255,255,.3);--sh:rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#0b1118;--surface:#1a2430;--ink:#eef1f3;--mute:#9fabb7;--line:rgba(255,255,255,.12);--accent:#f0993f;--on-accent:#2a1700;--b1:#e58a2f;--b2:#3b5f8f;--b3:#6a3c86;--day:0;--night:1;--glass-bd:rgba(255,255,255,.18);--glass-hi:rgba(255,255,255,.3);--sh:rgba(0,0,0,.5)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:80px;scroll-behavior:smooth;height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 17px/1.6 Onest,system-ui,sans-serif;transition:background .8s,color .8s;overflow-x:hidden}
img{display:block;max-width:100%}a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blob{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.55;transition:background .8s;animation:drift 22s ease-in-out infinite alternate}
.blob:nth-child(1){background:var(--b1);top:-20vmax;left:-15vmax}
.blob:nth-child(2){background:var(--b2);top:30vh;right:-25vmax;animation-duration:28s;animation-delay:-8s}
.blob:nth-child(3){background:var(--b3);bottom:-30vmax;left:20vw;animation-duration:34s;animation-delay:-14s}
@keyframes drift{to{transform:translate(12vmax,8vmax) scale(1.2) rotate(40deg)}}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.glass{position:relative;background:color-mix(in srgb,var(--surface) 45%,transparent);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--glass-bd);box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 -1px 0 rgba(255,255,255,.08),0 18px 50px var(--sh);overflow:hidden;--mx:50%;--my:0%}
.glass::before{content:"";position:absolute;inset:0;background:radial-gradient(240px circle at var(--mx) var(--my),var(--glass-hi),transparent 70%);opacity:.0;transition:opacity .4s;pointer-events:none}
.glass:hover::before{opacity:.55}
.glass>*{position:relative}
.nav{position:fixed;z-index:20;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(720px,calc(100% - 24px));display:flex;justify-content:space-between;align-items:center;padding:8px 10px 8px 20px;border-radius:99px;animation:drop .9s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes drop{from{transform:translate(-50%,-140%) scale(.8);opacity:0}}
.logo{font-weight:700;text-decoration:none;white-space:nowrap}
.nav nav{display:flex;gap:4px}
.nav nav a{text-decoration:none;font-size:15px;color:var(--mute);padding:8px 14px;border-radius:99px;white-space:nowrap;transition:background .3s,color .3s}
.nav nav a:hover{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--ink)}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;padding:120px 0 60px;min-height:min(100svh,900px)}
h1{font-weight:300;font-size:clamp(44px,7vw,84px);line-height:1;margin:0 0 24px;letter-spacing:-.03em}
h1 span{display:inline-block;animation:rise 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*90ms + 300ms)}
@keyframes rise{from{opacity:0;transform:translateY(.6em);filter:blur(14px)}}
.lead{font-size:19px;color:var(--mute);max-width:30em;margin:0 0 32px}
.photo{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--surface);border-radius:200px 200px 32px 32px;animation:morph 14s ease-in-out infinite alternate,pop 1.2s cubic-bezier(.2,.9,.3,1.1) both;box-shadow:0 30px 80px var(--sh)}
@keyframes morph{50%{border-radius:48% 52% 40% 60%/58% 42% 58% 42%}to{border-radius:120px 120px 120px 32px}}
@keyframes pop{from{opacity:0;transform:scale(.85);filter:blur(20px)}}
.photo img{position:absolute;inset:-4%;width:108%;height:108%;object-fit:cover;transition:opacity 1.1s,transform .3s ease-out;transform:translate(var(--px,0),var(--py,0))}
.photo .d{opacity:var(--day)}.photo .n{opacity:var(--night)}
.chip{position:absolute;left:16px;right:16px;bottom:16px;border-radius:24px;padding:14px 18px;font-size:15px;display:flex;flex-wrap:wrap;gap:6px 14px}
.chip b{font-weight:500}
.toggle{position:relative;display:inline-flex;border-radius:99px;padding:5px}
.toggle::after{content:"";position:absolute;top:5px;bottom:5px;left:5px;width:calc(50% - 5px);border-radius:99px;background:var(--accent);transition:transform .5s cubic-bezier(.3,1.5,.5,1);z-index:0}
.toggle[data-on="1"]::after{transform:translateX(100%)}
.toggle button{position:relative;z-index:1;flex:1;font:inherit;font-size:15px;border:0;background:none;color:var(--mute);padding:10px 26px;border-radius:99px;cursor:pointer;transition:color .4s}
.toggle button[aria-pressed="true"]{color:var(--on-accent)}
section{padding:64px 0}
h2{font-weight:500;font-size:clamp(28px,4vw,40px);line-height:1.15;margin:0 0 16px;letter-spacing:-.02em}
.intro{max-width:34em;color:var(--mute);margin:0 0 36px}
.gal{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.gal figure{margin:0;border-radius:28px;overflow:hidden;position:relative;cursor:zoom-in;transition:transform .5s cubic-bezier(.2,.9,.3,1.3),border-radius .5s;box-shadow:0 12px 36px var(--sh)}
.gal figure:hover{transform:translateY(-6px) scale(1.015);border-radius:44px 16px 44px 16px}
.gal img{width:100%;height:100%;object-fit:cover;aspect-ratio:4/3;transition:transform .8s}
.gal figure:hover img{transform:scale(1.07)}
.gal figcaption{position:absolute;left:12px;bottom:12px;font-size:14px;padding:6px 14px;border-radius:99px;background:color-mix(in srgb,var(--surface) 55%,transparent);-webkit-backdrop-filter:blur(14px) saturate(180%);backdrop-filter:blur(14px) saturate(180%);border:1px solid var(--glass-bd)}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s6{grid-column:span 6}.s6 img{aspect-ratio:21/8}
.list{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:0;padding:0;list-style:none}
.list li{border-radius:28px;padding:26px;transition:transform .5s cubic-bezier(.2,.9,.3,1.3)}
.list li:hover{transform:translateY(-6px)}
.list b{display:block;font-weight:500;font-size:19px;margin-bottom:4px}
.list span{color:var(--mute);font-size:15px}
.card{border-radius:36px;padding:28px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.split img{border-radius:28px;width:100%}
.cta{text-align:center;border-radius:44px;padding:56px 24px}
.cta .intro{margin:0 auto 28px}
.btn{position:relative;overflow:hidden;display:inline-block;background:var(--accent);color:var(--on-accent);padding:15px 32px;border-radius:99px;text-decoration:none;font-weight:500;transition:transform .4s cubic-bezier(.3,1.6,.5,1),border-radius .4s}
.btn:hover{transform:scale(1.06);border-radius:20px}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.3;transform:scale(0);animation:rip .7s ease-out}
@keyframes rip{to{transform:scale(4);opacity:0}}
.lang{display:flex;gap:2px;padding:3px;border-radius:99px;background:color-mix(in srgb,var(--ink) 8%,transparent)}
.lang button{font:inherit;font-size:13px;font-weight:500;border:0;background:none;color:var(--mute);padding:7px 12px;border-radius:99px;cursor:pointer;transition:background .4s,color .4s}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.near{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.pl{text-align:left;padding:18px 20px;border-radius:24px;border:0;background:none;font:inherit;cursor:pointer;transition:transform .4s}
.pl:hover{transform:translateY(-4px)}
.pl small{display:block;color:var(--mute);font-size:13px;margin-bottom:2px}
.pl strong{display:block;font-weight:500;font-size:17px}
.pl span{display:block;color:var(--mute);font-size:14px;margin:4px 0}
.pl em{font-style:normal;font-size:13px;color:var(--accent)}
.news{display:grid;gap:16px}
.nw{border-radius:28px;padding:22px 24px}
.nw .tag{display:inline-block;font-size:13px;padding:4px 12px;border-radius:99px;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);margin-bottom:10px}
.nw h3{margin:0 0 6px;font-weight:500;font-size:19px}
.nw p{margin:0;color:var(--mute);font-size:15px}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.rl{border-radius:28px;padding:22px}
.rl b{display:block;font-weight:500;margin-bottom:6px}
.rl span{color:var(--mute);font-size:15px}
.fund{display:grid;gap:14px}
.fd{border-radius:28px;padding:20px 22px}
.fd .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.fd b{font-weight:500}
.fd .amt{font-size:14px;color:var(--mute)}
.bar-bg{height:8px;border-radius:99px;background:color-mix(in srgb,var(--ink) 10%,transparent);overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:var(--accent)}
.docs{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.dc{border-radius:24px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.dc b{font-weight:500}
.dc span{color:var(--mute);font-size:14px}
.apts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.apts .dc{text-align:center}
.fm{display:grid;gap:14px}
.fm .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fm label{display:block;font-size:14px;color:var(--mute);margin-bottom:6px}
.fm input,.fm select,.fm textarea{width:100%;font:inherit;padding:12px 16px;border-radius:16px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 60%,transparent);color:var(--ink)}
.fm input.bad,.fm textarea.bad{border-color:#e55}
.fm textarea{min-height:90px;resize:vertical}
.ct{display:grid;gap:12px}
.row{display:block;border-radius:24px;padding:18px 20px;text-decoration:none;transition:transform .3s}
.row:hover{transform:translateY(-3px)}
.row small{display:block;color:var(--mute);font-size:13px;margin-bottom:2px}
.row strong{font-weight:500}
.note{font-size:14px;color:var(--mute);margin-top:16px}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.nums .glass{text-align:center;padding:18px 12px}
.nums strong{display:block;font-size:22px;font-weight:500}
.nums span{font-size:13px;color:var(--mute)}
footer{padding:28px 0 20px;color:var(--mute);font-size:13px;text-align:center}
.rv{opacity:0;filter:blur(12px);transform:translateY(24px);transition:opacity .8s,filter .8s,transform .8s}
.rv.in{opacity:1;filter:none;transform:none}
.lb{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s}
.lb.on{opacity:1;pointer-events:auto}
.lb img{max-width:92vw;max-height:88vh;border-radius:16px;object-fit:contain}
@media(max-width:700px){
.nav{width:calc(100% - 12px);padding:5px 10px 5px 12px;gap:6px;max-width:100%;justify-content:flex-start}
.nav .logo{font-size:14px;flex-shrink:0;margin-right:2px;white-space:nowrap}
.nav nav{display:flex;gap:1px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;flex:1 1 auto;min-width:0;justify-content:flex-start}
.nav nav::-webkit-scrollbar{display:none}
.nav nav a{font-size:12.5px;padding:5px 8px;white-space:nowrap !important;flex-shrink:0;display:inline-block}
.lang{flex-shrink:0;margin-left:4px}
.lang button{padding:5px 9px;font-size:11px}
.fm .two,.docs,.apts{grid-template-columns:1fr}
.nums{grid-template-columns:1fr 1fr}
.near{grid-template-columns:1fr}
.rules,.ct{grid-template-columns:1fr}
.hero,.split{grid-template-columns:1fr;gap:32px}
.hero{padding-top:100px;padding-bottom:40px;min-height:calc(100svh - 20px)}
.list{grid-template-columns:1fr}
.gal .s2,.gal .s3{grid-column:span 3}
.s6 img{aspect-ratio:16/9}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rv{opacity:1;filter:none;transform:none}}
</style></head><body>
<div class="blobs" aria-hidden="true"><i class="blob"></i><i class="blob"></i><i class="blob"></i></div>
<div class="nav glass"><a class="logo" href="#top">Fortuna Park</a><nav><a href="#news">Объявления</a><a href="#rules">О&nbsp;доме</a><a href="#fund">Сбор</a><a href="#nearby">Рядом</a><a href="#contact">Контакты</a></nav><div class="lang" role="group" aria-label="Language"><button data-l="ru">RU</button><button data-l="en">EN</button><button data-l="tr">TR</button></div></div>
<div class="wrap"><main id="top">
