<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d0f1a">
    <title>Fortuna Parkside — SwiftUI Liquid Glass Style</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0b0d17;
            color: #ffffff;
            overflow-x: hidden;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 2000px;
        }

        /* Фоновый градиент из примера SwiftUI (LinearGradient: blue to purple) */
        .swiftui-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 30%, #4a154b 70%, #240c26 100%);
            z-index: -1;
        }

        /* Анимированные световые переливы на фоне */
        .ambient-glow {
            position: absolute;
            width: 50vw;
            height: 50vw;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.5;
            pointer-events: none;
            animation: moveGlow 10s ease-in-out infinite alternate;
        }
        .glow-1 { top: -10%; left: -10%; background: #3b82f6; }
        .glow-2 { bottom: -10%; right: -10%; background: #a855f7; animation-delay: -5s; }

        @keyframes moveGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 30px) scale(1.15); }
        }

        /* Карточка с эффектом Liquid Glass (.glassEffect из SwiftUI) */
        .swiftui-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(40px) saturate(220%);
            -webkit-backdrop-filter: blur(40px) saturate(220%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 24px;
            padding: 40px;
            max-width: 480px;
            width: 90%;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.5),
                inset 0 1px 1px rgba(255, 255, 255, 0.6),
                inset 0 -1px 1px rgba(0, 0, 0, 0.4);
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 16px;
            animation: floatCard 6s ease-in-out infinite alternate;
        }

        @keyframes floatCard {
            0% { transform: translateY(0); }
            100% { transform: translateY(-10px); }
        }

        .swiftui-card h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        .swiftui-card p {
            font-size: 1rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.8);
        }

        .action-button {
            margin-top: 10px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            text-decoration: none;
            display: inline-block;
        }

        .action-button:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div class="swiftui-background">
        <div class="ambient-glow glow-1"></div>
        <div class="ambient-glow glow-2"></div>
    </div>

    <!-- Аналог структуры ZStack / VStack из вашего примера кода SwiftUI -->
    <div class="swiftui-card">
        <h1>Liquid Glass</h1>
        <p>Пример адаптации нового материала Apple из SwiftUI под веб-дизайн проекта Fortuna Parkside (Gazivisor).</p>
        <a class="action-button" href="index.html">Открыть проект</a>
    </div>

</body>
</html>
